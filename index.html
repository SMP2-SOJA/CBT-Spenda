<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Online - SMPN 2 SOYO JAYA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100">

    <div id="view-login" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
        <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl border-t-8 border-blue-600">
            <div class="text-center mb-6">
                <img src="/logo-sekolah.png" class="w-20 h-20 mx-auto mb-4 object-contain">
                <h2 class="text-2xl font-black text-slate-800 uppercase">CBT EXAM V.3</h2>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Username" class="w-full p-3 bg-slate-50 border rounded-xl">
                <input type="password" id="login-pass" placeholder="Password" class="w-full p-3 bg-slate-50 border rounded-xl">
                <button onclick="prosesLogin()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">MASUK</button>
            </div>
        </div>
    </div>

    <script src="/cbt/app.js"></script>
</body>
</html>
